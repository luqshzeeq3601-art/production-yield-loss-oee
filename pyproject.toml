[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-yield-loss-oee"
version = "0.1.0"
description = "Reproducible production yield loss and OEE analytics foundation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "pyyaml>=6.0,<7",
    "pytest>=8.0,<9",
    "matplotlib>=3.8,<4",
    "pgserver>=0.1.4,<1.0",
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
